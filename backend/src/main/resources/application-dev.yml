# Local-development overrides.
#
# Deliberately does NOT redeclare datasource / mail / media: application.yml
# already reads those from env vars whose defaults point at the local
# docker-compose services, so plain `spring-boot:run` needs nothing here.
# Hardcoding localhost in this profile silently clobbered DB_URL, MAIL_HOST
# and MEDIA_ENDPOINT for the containerised e2e stack, which runs with this
# profile to get the data seeder — the backend then died on Flyway startup.
spring:
  datasource:
    hikari:
      # Dev only: flags a connection held longer than 60s, which usually means a leak.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

app:
  auth:
    # Local signups have no mailbox to click through.
    auto-verify-emails: ${AUTO_VERIFY_EMAILS:true}
  jwt:
    # Dev-only convenience so `spring-boot:run` needs no setup. The prod profile has
    # no default at all and refuses to boot without a real JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-signing-key-do-not-deploy}
  recaptcha:
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
