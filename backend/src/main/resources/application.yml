spring:
  application:
    name: vetspace-backend
  servlet:
    multipart:
      # Container ceiling slightly above the largest business limit (study resources at
      # 25MB) so the services can reject oversize files with the standard error body;
      # bigger uploads are cut off at the container level
      # (MaxUploadSizeExceededException -> 413). Images stay capped at 4MB in
      # MediaService regardless — this is only the outer envelope.
      max-file-size: ${MAX_UPLOAD_SIZE:26MB}
      max-request-size: ${MAX_REQUEST_SIZE:27MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vetspace}
    username: ${DB_USER:vetspace}
    password: ${DB_PASSWORD:vetspace}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized explicitly rather than left to the default: see docs/deploy.md §13 for
      # why 10 is the ceiling that fits Railway's Postgres connection limit.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      # 0 disables; the dev profile turns it on to surface unclosed connections early.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
  lifecycle:
    # Upper bound on the graceful drain above.
    timeout-per-shutdown-phase: 20s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Defaults suit local mailpit only. Every real provider (Resend, SendGrid,
          # Brevo, ...) needs BOTH flipped on — with auth off, MAIL_USERNAME/PASSWORD
          # are silently never sent. ProductionConfigValidator enforces this in prod.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          # JavaMail's default timeouts are INFINITE. Without these, an SMTP server
          # that accepts the TCP connection but never answers hangs the registration
          # request (and the resend endpoint) forever — the browser just spins. With
          # them, the send fails within seconds, the failure branch reports
          # verificationEmailSent=false, and the user gets the "renvoyer" path.
          connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}
  # Let in-flight requests finish instead of severing them mid-response on redeploy.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  # Turns every rate limiter into a no-op. Test/dev convenience ONLY — repeated local
  # e2e runs otherwise trip the redeem and login limits. ProductionConfigValidator
  # refuses to start the prod profile when this is true.
  rate-limits-enabled: ${RATE_LIMITS_ENABLED:true}
  auth:
    # Marks new registrations verified immediately and skips the email. Dev/e2e only —
    # ProductionConfigValidator has no say here, so never set it in a real deployment.
    auto-verify-emails: ${AUTO_VERIFY_EMAILS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    # No default on purpose. A fallback value here would be a published signing key,
    # and ProductionConfigValidator refuses to start the prod profile without a real
    # one. application-dev.yml carries an explicitly dev-only value.
    secret: ${JWT_SECRET:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@vetspace.local}
    # log (dev default) | smtp | brevo-api. brevo-api sends over HTTPS:443 via Brevo's
    # REST API — the escape hatch for platforms that block outbound SMTP (Railway
    # free tier blocks 25/465/587 outright, so smtp can never work there).
    mode: ${MAIL_MODE:log}
    brevo-api-key: ${BREVO_API_KEY:}
  resources:
    # Free study-resource library. Reachable in full because the SPA sends multipart
    # uploads straight to this API rather than through the Vercel rewrite, which 502s
    # on a 25MB body. See docs/deploy.md.
    max-file-size-mb: ${RESOURCE_MAX_FILE_SIZE_MB:25}
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    bucket: ${MEDIA_BUCKET:vetspace}
    access-key: ${MEDIA_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_SECRET_KEY:minioadmin}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/vetspace}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
    enabled: ${RECAPTCHA_ENABLED:true}
  demo:
    question-limit: ${DEMO_QUESTION_LIMIT:10}
  support:
    inbox: ${SUPPORT_INBOX:support@vetspace.local}
  cookie:
    # Same-origin by default (dev, and the nginx-proxied container stack).
    # application-prod.yml overrides this for the split Vercel/Railway deploy.
    same-site: ${COOKIE_SAME_SITE:Strict}
    secure: ${COOKIE_SECURE:true}
  seed:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-username: ${ADMIN_USERNAME:admin}
    # One-shot first-admin bootstrap on an empty prod database; remove after use.
    admin-enabled: ${SEED_ADMIN:false}
    # Deterministic activation code seeded for automated e2e; leave empty everywhere except the e2e stack.
    e2e-code: ${E2E_SEED_CODE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    # `[%X{requestId}]` prints the correlation id set by RequestIdFilter on every line,
    # so a request id quoted from an error toast greps straight to the request's own log
    # output. Empty brackets mean the work happened outside a request — a scheduled job
    # or startup — which is itself worth being able to tell apart.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{requestId}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
