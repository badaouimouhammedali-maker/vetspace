spring:
  application:
    name: vetspace-backend
  servlet:
    multipart:
      # Container ceiling slightly above the app's 5MB business limit so MediaService
      # can reject 5-6MB files with the standard error body; bigger uploads are cut
      # off at the container level (MaxUploadSizeExceededException -> 413).
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vetspace}
    username: ${DB_USER:vetspace}
    password: ${DB_PASSWORD:vetspace}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:change-me}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@vetspace.local}
    mode: ${MAIL_MODE:log}
  media:
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9000}
    bucket: ${MEDIA_BUCKET:vetspace}
    access-key: ${MEDIA_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_SECRET_KEY:minioadmin}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/vetspace}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
    enabled: ${RECAPTCHA_ENABLED:true}
  demo:
    question-limit: ${DEMO_QUESTION_LIMIT:10}
  support:
    inbox: ${SUPPORT_INBOX:support@vetspace.local}
  seed:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
