services:
  postgres:
    image: postgres:16
    container_name: dev-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vetspace}
      POSTGRES_USER: ${DB_USER:-vetspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vetspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vetspace} -d ${DB_NAME:-vetspace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dev-media
    environment:
      MINIO_ROOT_USER: ${MEDIA_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: vetspace-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # --- Full seeded application stack for end-to-end tests: `docker compose --profile e2e up` ---
  backend:
    build: ./backend
    container_name: vetspace-e2e-backend
    profiles: ["e2e"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev            # dev profile runs the data seeder
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vetspace}
      DB_USER: ${DB_USER:-vetspace}
      DB_PASSWORD: ${DB_PASSWORD:-vetspace}
      ADMIN_EMAIL: admin@vetspace.local
      ADMIN_PASSWORD: e2e-admin-password
      E2E_SEED_CODE: E2E1-2345-6789-ABCD      # deterministic code the smoke test redeems
      RECAPTCHA_ENABLED: "false"
      # No mailbox to click through in an automated run; the dev profile already
      # defaults this on, set explicitly so the intent is visible.
      AUTO_VERIFY_EMAILS: "true"
      JWT_SECRET: e2e-only-secret-not-for-prod
      CORS_ALLOWED_ORIGINS: http://localhost:8088
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/vetspace
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: vetspace-e2e-frontend
    profiles: ["e2e"]
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  postgres_data:
  minio_data:
