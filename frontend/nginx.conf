# gzip for the text payloads; images and fonts are already compressed.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/json
  application/javascript
  application/xml
  image/svg+xml;

server {
  listen 80;
  server_name _;

  # API calls are proxied to the backend container (same-origin → no CORS needed).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  root /usr/share/nginx/html;

  # Vite emits content-hashed filenames, so a given URL's bytes never change:
  # cache them for a year and skip revalidation entirely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html is the one file whose URL is stable while its contents change every
  # deploy — caching it would pin users to an old bundle referencing deleted chunks.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
