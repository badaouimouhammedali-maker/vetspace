name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (verify + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # caches ~/.m2
      - name: mvnw verify (Testcontainers + JaCoCo >=70% service coverage)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + test + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: npm audit (production deps, fail on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  dependency-check:
    name: OWASP dependency-check (non-blocking without NVD key)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}
      - name: dependency-check (fails on CVSS >= 7)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress -Psecurity verify -DskipTests -Djacoco.skip=true -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

  e2e:
    name: E2E (Playwright vs seeded docker-compose stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build + start the seeded e2e stack
        run: docker compose --profile e2e up -d --build
      - name: Wait for backend + frontend
        run: |
          # Poll, then assert. A bare retry loop "succeeds" when the service never
          # comes up at all, which sends Playwright at a dead stack and reports the
          # failure as a confusing test error instead of a startup crash.
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health >/dev/null && break; sleep 3; done
          curl -sf http://localhost:8080/actuator/health >/dev/null || {
            echo "::error::backend never became healthy"; exit 1; }
          for _ in $(seq 1 30); do curl -sf http://localhost:8088 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8088 >/dev/null || {
            echo "::error::frontend never became reachable"; exit 1; }
      - name: Install Playwright + browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run smoke test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
          E2E_SEED_CODE: E2E1-2345-6789-ABCD
        run: npm test
      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile e2e logs --tail=200
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile e2e down -v
