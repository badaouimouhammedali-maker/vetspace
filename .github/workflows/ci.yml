name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (verify + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # caches ~/.m2
      - name: mvnw verify (Testcontainers + JaCoCo >=70% service coverage)
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + test + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests + coverage gate (>=60% lines on lib/auth/components)
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: npm audit (production deps, fail on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # The OWASP dependency-check job used to live here. It moved to
  # .github/workflows/dependency-scan.yml — weekly and on demand — because a CVE
  # published overnight in a transitive dependency has nothing to do with the commit
  # being merged. This pipeline keeps only fast, commit-scoped checks.

  config-sanity:
    name: Config sanity (placeholders + prod image boots + refuses unsafe config)
    runs-on: ubuntu-latest
    # Independent of the unit jobs on purpose: this catches deployment-shaped failures
    # (a placeholder left in, an image that will not boot) which have nothing to do with
    # whether the tests pass, and it is the slowest signal — no reason to queue it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vetspace
          POSTGRES_USER: vetspace
          POSTGRES_PASSWORD: vetspace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vetspace -d vetspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run config sanity
        env:
          # The runner's postgres service is published on localhost; the script runs the
          # image with --network host so the container resolves it the same way.
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: vetspace
          DB_USER: vetspace
          DB_PASSWORD: vetspace
        run: scripts/config-sanity.sh

  backup:
    name: Backup (dump -> object storage -> restore into a scratch database)
    runs-on: ubuntu-latest
    # The backup only matters on the day it is used, which is the worst possible day to
    # discover it has rotted. So CI takes a real dump, uploads it to a real S3-compatible
    # endpoint, restores it into a real database and reads rows back out. A green tick
    # here means the recovery path executed end to end, not that a script parsed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vetspace
          POSTGRES_USER: vetspace
          POSTGRES_PASSWORD: vetspace
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vetspace -d vetspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: vetspace-backups
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      R2_ENDPOINT: http://localhost:9000
      R2_BACKUP_BUCKET: vetspace-backups
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - name: Build the backup image
        run: docker build -t vetspace-backup:ci backup/

      # Something has to exist to be backed up, and it has to be the real schema: the
      # dump verification asserts on flyway_schema_history and a table count, which is
      # exactly the check that would catch a dump of the wrong database.
      - name: Apply migrations
        working-directory: backend
        run: ./mvnw -B -q flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/vetspace -Dflyway.user=vetspace -Dflyway.password=vetspace -Dflyway.locations=filesystem:src/main/resources/db/migration

      - name: Take a backup
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://vetspace:vetspace@localhost:5432/vetspace" \
            -e R2_ENDPOINT -e R2_BACKUP_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            vetspace-backup:ci

      - name: Restore it into a scratch database
        run: |
          docker run --rm --network host \
            -e R2_ENDPOINT -e R2_BACKUP_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e SCRATCH_ADMIN_URL="postgres://vetspace:vetspace@localhost:5432/postgres" \
            --entrypoint /usr/local/bin/restore-check.sh vetspace-backup:ci

      # The destructive path deserves its own proof. A backup job that prunes the wrong
      # objects is worse than one that never prunes at all.
      - name: Retention deletes only what is past the window
        run: |
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION=auto \
            --entrypoint sh vetspace-backup:ci -c '
              echo stale > /tmp/old.gz
              aws --endpoint-url '"$R2_ENDPOINT"' s3 cp /tmp/old.gz \
                s3://'"$R2_BACKUP_BUCKET"'/db/vetspace-20200101T000000Z.sql.gz >/dev/null'
          docker run --rm --network host \
            -e DATABASE_URL="postgres://vetspace:vetspace@localhost:5432/vetspace" \
            -e R2_ENDPOINT -e R2_BACKUP_BUCKET \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e RETENTION_DAYS=30 vetspace-backup:ci
          REMAINING=$(docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION=auto \
            --entrypoint aws vetspace-backup:ci \
            --endpoint-url "$R2_ENDPOINT" s3 ls "s3://$R2_BACKUP_BUCKET/db/")
          echo "$REMAINING"
          if echo "$REMAINING" | grep -q "vetspace-20200101"; then
            echo "::error::retention did not prune the stale backup"; exit 1
          fi
          if [ "$(echo "$REMAINING" | grep -c 'vetspace-')" -lt 2 ]; then
            echo "::error::retention pruned backups that were inside the window"; exit 1
          fi

  e2e:
    name: E2E (Playwright vs seeded docker-compose stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build + start the seeded e2e stack
        run: docker compose -f scripts/e2e.compose.yml up -d --build
      - name: Wait for backend + frontend
        run: |
          # Poll, then assert. A bare retry loop "succeeds" when the service never
          # comes up at all, which sends Playwright at a dead stack and reports the
          # failure as a confusing test error instead of a startup crash.
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health >/dev/null && break; sleep 3; done
          curl -sf http://localhost:8080/actuator/health >/dev/null || {
            echo "::error::backend never became healthy"; exit 1; }
          for _ in $(seq 1 30); do curl -sf http://localhost:8088 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8088 >/dev/null || {
            echo "::error::frontend never became reachable"; exit 1; }
          # Health is UP once the port binds, but the dev seeder runs after that.
          # Starting Playwright here would race it onto an empty catalog.
          for _ in $(seq 1 45); do
            n=$(curl -s http://localhost:8080/api/public/stats | grep -o '"questions":[0-9]*' | grep -o '[0-9]*' || echo 0)
            [ "${n:-0}" -gt 0 ] && break
            sleep 2
          done
          [ "$(curl -s http://localhost:8080/api/public/stats | grep -o '"questions":[0-9]*' | grep -o '[0-9]*')" -gt 0 ] || {
            echo "::error::catalog was never seeded"; exit 1; }
      - name: Install Playwright + browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e journeys (student + admin)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8088
          E2E_SEED_CODE: E2E1-2345-6789-ABCD
        run: npm test
      - name: Assert both journeys ran and passed
        # `playwright test` exits 0 when it runs zero tests, so a spec that silently
        # stopped being picked up would leave this job green with half its coverage
        # gone. This makes the green tick mean "both journeys passed", and prints the
        # per-journey verdict to the step summary — readable without the repository
        # admin rights that job logs and artifacts require.
        if: always()
        working-directory: e2e
        run: node assert-journeys.mjs
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f scripts/e2e.compose.yml logs --tail=200
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f scripts/e2e.compose.yml down -v
