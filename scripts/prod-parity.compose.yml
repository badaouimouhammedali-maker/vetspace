# Production-parity stack: the real backend image on the prod profile, the real
# production frontend bundle, and MinIO standing in for Cloudflare R2.
#
# Ports are shifted into the 19xxx range so this can run alongside the dev stack.
# The SPA is served from :19088 and calls the API on :19080 — deliberately a
# different origin, so CORS and the cross-site refresh cookie are exercised the
# same way they will be on Vercel + Railway.
name: vetspace-prod-parity

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vetspace
      POSTGRES_USER: vetspace
      POSTGRES_PASSWORD: parity-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetspace -d vetspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: parityaccess
      MINIO_ROOT_PASSWORD: paritysecret
    ports:
      - "19000:9000"

  mailpit:
    # Real SMTP endpoint: the prod profile refuses MAIL_MODE=log, and registration now
    # sends a verification email, so the stack needs somewhere for mail to land.
    image: axllent/mailpit
    ports:
      - "18025:8025"

  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PROFILES is supplied by prod-parity.sh: "prod" for the hardening checks,
      # then "dev,prod" for the journey (dev only contributes its data seeder;
      # prod is listed last so its configuration wins every conflict).
      SPRING_PROFILES_ACTIVE: ${PROFILES:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/vetspace
      DB_USER: vetspace
      DB_PASSWORD: parity-only-password
      # Must satisfy ProductionConfigValidator: not a known default, >= 32 bytes.
      JWT_SECRET: 8Xk2pQ7vR4mN9wZ3cF6hJ0tL5dA1gE8uI4oP2qS7yB=
      FRONTEND_URL: http://localhost:19088
      # Phase B only, and only because an unattended journey has no mailbox to click
      # through. The prod profile REFUSES to start with this on, which is why Phase B
      # runs the dev profile — see prod-parity.sh.
      AUTO_VERIFY_EMAILS: "${AUTO_VERIFY_EMAILS:-false}"
      # Same reasoning: repeated local runs otherwise trip the redeem limit. Also
      # rejected outright by the prod profile.
      RATE_LIMITS_ENABLED: "${RATE_LIMITS_ENABLED:-true}"
      # The prod profile rejects localhost origins. The browser never needs CORS here
      # anyway — nginx proxies /api same-origin — so this is only what the API allows
      # for direct cross-origin callers, and prod-parity.sh asserts against it.
      CORS_ALLOWED_ORIGINS: https://parity.invalid
      MAIL_MODE: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_BUCKET: vetspace
      MEDIA_ACCESS_KEY: parityaccess
      MEDIA_SECRET_KEY: paritysecret
      MEDIA_PUBLIC_BASE_URL: http://localhost:19000/vetspace
      # DEVIATION from production: the captcha needs a real Google key pair and a
      # real browser to solve, so it cannot run unattended. Everything else on
      # this stack matches the prod profile.
      RECAPTCHA_ENABLED: "false"
      # One-shot admin bootstrap, exactly as documented for Railway.
      # Phase A only. In Phase B the dev seeder creates the admin, and enabling both
      # would race: AdminBootstrap creating a user first makes DevDataSeeder skip
      # ("already seeded"), leaving an empty catalog and a journey with nothing to play.
      SEED_ADMIN: "${SEED_ADMIN:-true}"
      ADMIN_EMAIL: admin@vetspace.local
      ADMIN_PASSWORD: parity-admin-password
      # Deterministic activation code, seeded only when the dev seeder runs.
      E2E_SEED_CODE: E2E1-2345-6789-ABCD
    ports:
      - "19080:8080"

  frontend:
    # VITE_API_URL is intentionally left empty so the SPA calls same-origin
    # /api/*, which nginx proxies to the backend — the local stand-in for the
    # Vercel rewrite. That reproduces the first-party refresh cookie the real
    # deployment relies on.
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "19088:80"
